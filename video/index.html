<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dumbtv — launch film</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script type="module">
import { drawFrame } from './src/film.js';
import { initLayers } from './src/design.js';

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });

const load = (src) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = reject;
  img.src = src;
});

const images = {};
await Promise.all([
  document.fonts.load('300 100px "Helvetica Neue"'),
  document.fonts.load('400 100px "Helvetica Neue"'),
  document.fonts.load('500 100px "Helvetica Neue"'),
  document.fonts.load('200 100px "Helvetica Neue"'),
  document.fonts.load('400 20px "Geist Mono"'),
  document.fonts.load('500 20px "Geist Mono"'),
  document.fonts.load('300 20px "Geist Mono"'),
]);
await document.fonts.ready;
images.home = await load('./assets/home.png');

initLayers();

window.__frame = (t) => {
  drawFrame(ctx, t, images);
  return true;
};
window.__audit = (t) => {
  const recs = [];
  const proto = CanvasRenderingContext2D.prototype;
  const orig = proto.fillText;
  proto.fillText = function (str, x, y) {
    if (!str || !String(str).trim()) return orig.call(this, str, x, y);
    const m = this.measureText(str);
    const asc = m.actualBoundingBoxAscent || parseFloat(this.font) * 0.8;
    const desc = m.actualBoundingBoxDescent || parseFloat(this.font) * 0.2;
    const tr = this.getTransform();
    const pts = [
      [x, y - asc], [x + m.width, y - asc],
      [x, y + desc], [x + m.width, y + desc],
    ].map(([px, py]) => [tr.a * px + tr.c * py + tr.e, tr.b * px + tr.d * py + tr.f]);
    const xs = pts.map((p) => p[0]);
    const ys = pts.map((p) => p[1]);
    recs.push({
      s: String(str),
      x0: Math.min(...xs), y0: Math.min(...ys),
      x1: Math.max(...xs), y1: Math.max(...ys),
      size: parseFloat(this.font),
      a: this.globalAlpha,
    });
    return orig.call(this, str, x, y);
  };
  try { drawFrame(ctx, t, images); } finally { proto.fillText = orig; }

  const bad = [];
  for (const r of recs) {
    if (r.a < 0.05) continue;
    if (r.x0 < -4 || r.y0 < -6 || r.x1 > 1924 || r.y1 > 1086) {
      bad.push({ kind: 'out', t, s: r.s, box: [r.x0, r.y0, r.x1, r.y1].map(Math.round) });
    }
  }
  for (let i = 0; i < recs.length; i++) {
    for (let j = i + 1; j < recs.length; j++) {
      const a = recs[i], b = recs[j];
      if (a.a < 0.35 || b.a < 0.35) continue;
      if (a.size < 11 || b.size < 11) continue;
      const ix = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
      const iy = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
      if (ix <= 0 || iy <= 0) continue;
      const small = Math.min((a.x1 - a.x0) * (a.y1 - a.y0), (b.x1 - b.x0) * (b.y1 - b.y0));
      if ((ix * iy) / small > 0.3) {
        bad.push({ kind: 'overlap', t, a: a.s, b: b.s, box: [Math.round(ix), Math.round(iy)] });
      }
    }
  }
  return bad;
};
window.__ready = true;

const params = new URLSearchParams(location.search);
if (params.has('t')) window.__frame(parseFloat(params.get('t')));
</script>
</body>
</html>
