id: fireos-amazon-aftkrt
title: "Amazon Fire TV Stick 4K Max, 2nd gen (AFTKRT)"
contributors:
  - gerardo-galvez-hl
platform: fireos
status: partial
tested_on: "RS8182.3811N"
models:
  - "AFTKRT (Fire TV Stick 4K Max 2nd gen; codename karat)"
adb:
  port: 5555
  transport: wifi
developer_mode: >-
  ADB debugging was already enabled from an earlier session (Settings > My Fire TV > Developer Options > ADB debugging: ON); the click count to unlock Developer Options was not recorded
ip_location: "not recorded this session: the address was read from the router's DHCP leases"
prompts:
  - name: "USB debugging authorization"
    blocks_automation: true
    fix: "human presses Allow on the TV on the first adb connect from a new machine; tick Always allow"
data:
  packages: data/fireos/packages.txt
  protected: data/fireos/protected.txt
  never_disable: data/fireos/never-disable.txt
  user_apps: data/fireos/user-apps.txt
quirks:
  - "Different model from catalog/devices/fireos-amazon-aftkm.yaml (issue #8) but the same codename (karat) and build (RS8182.3811N, Fire OS 8.1.8.2), so the Fire OS 8 findings there (Android/data unreachable from adb) most likely apply here too. dnsfilter.sh and launcher.sh were not run on this unit. The Fire OS 8 HOME fix in launcher 1.2 was confirmed on an AFTKRT by its author (PR #49)"
  - "debloat.sh printed 'no cmd package install-existing' although the command exists (line 120 of cmd package help): need_device runs adb shell 'cmd package help' | grep -q install-existing under set -o pipefail; grep -q exits on the first match, adb gets a broken pipe and returns 255, so REINSTALL=0. Reproduced 5/5 with pipefail, 3/3 succeed without it. Timing-dependent: the issue #8 run on the same build detected it (10 removed). Harmless here, every package was disabled instead of uninstalled"
  - "debloat.sh: 0 removed, 58 disabled, 0 protected, 0 suspect, 9 absent (none of the regional user apps are installed). com.amazon.ceviche and com.amazon.neo.minerva.logcat kept running after disable-user and were starved; after a reboot ceviche stays stopped but minerva.logcat is running again while still disabled"
  - "Unlike issue #8, com.amazon.dummy.settings and com.android.traceur were still disabled after a reboot here (both were disabled, not uninstalled)"
  - "lockdown.sh: device.metrics, crashmanager, ftvads.deeplinking, tv.csapp, software.ota and ota.override all accepted RUN_ANY_IN_BACKGROUND ignore and the background-data blacklist; device.rdmapplication is absent"
  - "com.amazon.vizzini had been disabled weeks earlier with pm disable-user by another debloat tool and was found enabled again, consistent with keeping it in never-disable.txt"
  - "Not caused by dumbtv, but easy to blame on it: Plex for Fire TV 2026.20.0 (targetSdk 36) is denied the sticky HDMI_AUDIO_PLUG broadcast (Permission Denial ... DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION), cannot detect passthrough, bans the audio codec ('Audio codec banned on device') and transcodes TrueHD to EAC3. Fix in the app: Settings > Audio > Passthrough: HDMI with TrueHD and EAC3 enabled"
notes: "Fire OS 8.1.8.2 (Android 11): debloat.sh and lockdown.sh ran clean and verify.sh passed with the DNS and home checks skipped. dnsfilter.sh and launcher.sh were not run by choice (DNS filtering is done network-wide by Pi-hole), so status is partial"
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
